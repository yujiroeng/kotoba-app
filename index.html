<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ことばアプリ</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: sans-serif;
  background: #f5f5f5;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin: 10px 0 20px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  max-width: 1000px;
  margin: auto;
}

button {
  border: none;
  border-radius: 25px;
  background: white;
  padding: 20px 10px;
  min-height: 190px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}

.emoji {
  display: block;
  font-size: 90px;
  margin-bottom: 10px;
}

@media (max-width: 900px) {
  .buttons {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 650px) {
  .buttons {
    grid-template-columns: repeat(2, 1fr);
  }

  button {
    min-height: 170px;
    font-size: 25px;
  }

  .emoji {
    font-size: 75px;
  }
}
</style>
</head>

<body>

<h1>ことば</h1>

<div class="buttons">

<button onclick="speak('ごはん')">
<span class="emoji">🍚</span>
ごはん
</button>

<button onclick="speak('ねむたい')">
<span class="emoji">😴</span>
ねる
</button>

<button onclick="speak('おしっこ')">
<span class="emoji">🚽</span>
トイレ
</button>

<button onclick="speak('遊ぶ')">
<span class="emoji">🧸</span>
遊ぶ
</button>

<button onclick="speak('おみず')">
<span class="emoji">💧</span>
おみず
</button>

<button onclick="speak('だっこ')">
<span class="emoji">🤗</span>
だっこ
</button>

<button onclick="speak('ちょうだい')">
<span class="emoji">👍</span>
ちょうだい
</button>

<button onclick="speak('すき')">
<span class="emoji">❤️</span>
すき
</button>

<button onclick="speak('いや')">
<span class="emoji">😣</span>
いや
</button>

<button onclick="speak('かなしい')">
<span class="emoji">😢</span>
かなしい
</button>

<button onclick="speak('いたい')">
<span class="emoji">🤕</span>
いたい
</button>

<button onclick="speak('パパ')">
<span class="emoji">👨</span>
パパ
</button>

<button onclick="speak('ママ')">
<span class="emoji">👩</span>
ママ
</button>

</div>

<script>
function speak(text) {

  if (!window.speechSynthesis) {
    alert("この端末では音声読み上げが使えません");
    return;
  }

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);

  voice.lang = "ja-JP";
  voice.rate = 0.8;
  voice.pitch = 1.0;
  voice.volume = 1.0;

  window.speechSynthesis.speak(voice);
}
</script>

</body>
</html>
