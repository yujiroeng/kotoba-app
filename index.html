<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ことばアプリ</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 15px;
  font-family: -apple-system, BlinkMacSystemFont,
               "Hiragino Maru Gothic ProN",
               "Hiragino Kaku Gothic ProN", sans-serif;
  background: linear-gradient(180deg, #dff6ff, #fff7fb);
  text-align: center;
  color: #4b2e20;
  -webkit-tap-highlight-color: transparent;
}
h1 {
  font-size: 42px;
  margin: 5px 0 10px;
  font-weight: 900;
}
.subtitle {
  font-size: 18px;
  margin-bottom: 15px;
}
/* 以前作った1枚のイラスト */
.main-image {
  display: block;
  width: min(100%, 900px);
  max-height: 55vh;
  object-fit: contain;
  margin: 0 auto 20px;
  border-radius: 25px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
  background: white;
}
.image-area {
  position: relative;
  width: min(100%, 900px);
  margin: 0 auto 20px;
}

.image-area .main-image {
  width: 100%;
  margin: 0;
}

.tap-food {
  position: absolute;
  left: 0;
  top: 0;
  width: 25%;
  height: 25%;
  opacity: 0.5;
  border: none;
  background: transparent;
}
  
/* 言葉ボタン */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  max-width: 1100px;
  margin: auto;
}
button {
  position: relative;
  border: 5px solid white;
  border-radius: 28px;
  min-height: 120px;
  padding: 15px 10px;
  background: white;
  box-shadow: 0 6px 12px rgba(0,0,0,0.15);
  font-family: inherit;
  font-size: 30px;
  font-weight: 900;
  color: #43291f;
  cursor: pointer;
  transition: transform 0.1s;
}
button:active {
  transform: scale(0.94);
}
.speaker {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #248be8;
  color: white;
  font-size: 23px;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* ボタンの色 */
.food { background: #ffe5ec; }
.sleep { background: #fff1a8; }
.toilet { background: #dff3ff; }
.play { background: #dfffc9; }
.water { background: #d7f8ff; }
.hug { background: #ffdce9; }
.give { background: #fff0d1; }
.love { background: #eee0ff; }
.no { background: #e8e9ff; }
.sad { background: #dceeff; }
.pain { background: #ddf8e2; }
.dad { background: #dff1ff; }
.mom { background: #ffe2ec; }
.bottom {
  max-width: 900px;
  margin: 20px auto 5px;
  background: white;
  border-radius: 25px;
  padding: 18px;
  font-size: 24px;
  font-weight: bold;
  box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}
@media (max-width: 900px) {
  .buttons {
    grid-template-columns: repeat(3, 1fr);
  }
}
@media (max-width: 650px) {
  body {
    padding: 8px;
  }
  h1 {
    font-size: 32px;
  }
  .subtitle {
    font-size: 15px;
  }
  .main-image {
    max-height: 45vh;
    border-radius: 18px;
  }
  .buttons {
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
  }
  button {
    min-height: 100px;
    border-radius: 22px;
    font-size: 23px;
    border-width: 4px;
  }
  .speaker {
    width: 38px;
    height: 38px;
    font-size: 20px;
  }
  .bottom {
    font-size: 19px;
  }
}
</style>
</head>
<body>
<h1>☁️ ことばアプリ ☁️</h1>
<div class="subtitle">
  おしたら こえが でるよ 🔊
</div>
<!-- 以前作った1枚のイラスト -->

<div class="image-area">
  <img
    class="main-image"
    src="./90CC2A43-298A-48E0-9499-A5C2D08FF1B6.png"
    alt="ことばのイラスト">

  <button class="tap-food" onclick="speak('ごはん')"></button>
</div>

<div class="buttons">
<button class="food" onclick="speak('ごはん')">
  <span class="speaker">🔊</span>
  ごはん
</button>
<button class="sleep" onclick="speak('ねむたい')">
  <span class="speaker">🔊</span>
  ねる
</button>
<button class="toilet" onclick="speak('おしっこ')">
  <span class="speaker">🔊</span>
  トイレ
</button>
<button class="play" onclick="speak('遊ぶ')">
  <span class="speaker">🔊</span>
  遊ぶ
</button>
<button class="water" onclick="speak('おみず')">
  <span class="speaker">🔊</span>
  おみず
</button>
<button class="hug" onclick="speak('だっこ')">
  <span class="speaker">🔊</span>
  だっこ
</button>
<button class="give" onclick="speak('ちょうだい')">
  <span class="speaker">🔊</span>
  ちょうだい
</button>
<button class="love" onclick="speak('すき')">
  <span class="speaker">🔊</span>
  すき
</button>
<button class="no" onclick="speak('いや')">
  <span class="speaker">🔊</span>
  いや
</button>
<button class="sad" onclick="speak('かなしい')">
  <span class="speaker">🔊</span>
  かなしい
</button>
<button class="pain" onclick="speak('いたい')">
  <span class="speaker">🔊</span>
  いたい
</button>
<button class="dad" onclick="speak('パパ')">
  <span class="speaker">🔊</span>
  パパ
</button>
<button class="mom" onclick="speak('ママ')">
  <span class="speaker">🔊</span>
  ママ
</button>
</div>
<div class="bottom">
  🔊 ボタンをタップすると声が出ます<br>
  🌈 たくさん つかってね！
</div>
<script>
function speak(text) {
  if (!window.speechSynthesis) {
    alert("この端末では音声読み上げが使えません");
    return;
  }
  window.speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = "ja-JP";
  voice.rate = 0.8;
  voice.pitch = 1.0;
  voice.volume = 1.0;
  window.speechSynthesis.speak(voice);
}
</script>
</body>
</html>
