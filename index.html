<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ことばアプリ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: -apple-system, BlinkMacSystemFont,
               "Hiragino Maru Gothic ProN",
               "Hiragino Kaku Gothic ProN", sans-serif;
  background: linear-gradient(180deg, #dff6ff, #fff7fb);
  text-align: center;
  color: #4b2e20;
  -webkit-tap-highlight-color: transparent;
}

h1 {
  font-size: 42px;
  margin: 5px 0 10px;
  font-weight: 900;
}

.subtitle {
  font-size: 18px;
  margin-bottom: 15px;
}

/* 画像とタップ範囲 */
.image-area {
  position: relative;
  width: min(100%, 900px);
  margin: 0 auto;
}

.main-image {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  border-radius: 25px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
  background: white;
}

/* 透明なタップボタン */
.tap {
  position: absolute;
  border: none;
  background: transparent;
  opacity: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
}

/*
  画像の中のイラスト位置
*/

/* 1段目 */
.food {
  left: 1%;
  top: 12%;
  width: 24%;
  height: 23%;
}

.sleep {
  left: 26%;
  top: 12%;
  width: 24%;
  height: 23%;
}

.toilet {
  left: 51%;
  top: 12%;
  width: 24%;
  height: 23%;
}

.play {
  left: 76%;
  top: 12%;
  width: 23%;
  height: 23%;
}

/* 2段目 */
.water {
  left: 1%;
  top: 36%;
  width: 24%;
  height: 23%;
}

.hug {
  left: 26%;
  top: 36%;
  width: 24%;
  height: 23%;
}

.give {
  left: 51%;
  top: 36%;
  width: 24%;
  height: 23%;
}

.love {
  left: 76%;
  top: 36%;
  width: 23%;
  height: 23%;
}

/* 3段目 */
.no {
  left: 1%;
  top: 60%;
  width: 19%;
  height: 23%;
}

.sad {
  left: 21%;
  top: 60%;
  width: 19%;
  height: 23%;
}

.pain {
  left: 41%;
  top: 60%;
  width: 19%;
  height: 23%;
}

.dad {
  left: 61%;
  top: 60%;
  width: 19%;
  height: 23%;
}

.mom {
  left: 81%;
  top: 60%;
  width: 18%;
  height: 23%;
}


/* 押したときの軽い反応 */
.tap:active {
  opacity: 0.15;
  background: white;
}


/* iPhoneなど */
@media (max-width: 650px) {

  body {
    padding: 8px;
  }

  h1 {
    font-size: 32px;
  }

  .subtitle {
    font-size: 15px;
  }

  .main-image {
    border-radius: 18px;
  }
}
</style>
</head>

<body>

<h1>☁️ ことばアプリ ☁️</h1>

<div class="subtitle">
  おしたら こえが でるよ 🔊
</div>


<!-- 1枚のイラスト画像 -->
<div class="image-area">

  <img
    class="main-image"
    src="./90CC2A43-298A-48E0-9499-A5C2D08FF1B6.png"
    alt="ことばのイラスト"
  >


  <!-- ごはん -->
  <button
    class="tap food"
    onclick="speak('ごはん')"
    aria-label="ごはん">
  </button>

  <!-- ねる -->
  <button
    class="tap sleep"
    onclick="speak('ねむたい')"
    aria-label="ねる">
  </button>

  <!-- トイレ -->
  <button
    class="tap toilet"
    onclick="speak('おしっこ')"
    aria-label="トイレ">
  </button>

  <!-- 遊ぶ -->
  <button
    class="tap play"
    onclick="speak('遊ぶ')"
    aria-label="遊ぶ">
  </button>


  <!-- おみず -->
  <button
    class="tap water"
    onclick="speak('おみず')"
    aria-label="おみず">
  </button>

  <!-- だっこ -->
  <button
    class="tap hug"
    onclick="speak('だっこ')"
    aria-label="だっこ">
  </button>

  <!-- ちょうだい -->
  <button
    class="tap give"
    onclick="speak('ちょうだい')"
    aria-label="ちょうだい">
  </button>

  <!-- すき -->
  <button
    class="tap love"
    onclick="speak('すき')"
    aria-label="すき">
  </button>


  <!-- いや -->
  <button
    class="tap no"
    onclick="speak('いや')"
    aria-label="いや">
  </button>

  <!-- かなしい -->
  <button
    class="tap sad"
    onclick="speak('かなしい')"
    aria-label="かなしい">
  </button>

  <!-- いたい -->
  <button
    class="tap pain"
    onclick="speak('いたい')"
    aria-label="いたい">
  </button>

  <!-- パパ -->
  <button
    class="tap dad"
    onclick="speak('パパ')"
    aria-label="パパ">
  </button>

  <!-- ママ -->
  <button
    class="tap mom"
    onclick="speak('ママ')"
    aria-label="ママ">
  </button>

</div>


<script>

function speak(text) {

  if (!window.speechSynthesis) {
    alert("この端末では音声読み上げが使えません");
    return;
  }

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);

  voice.lang = "ja-JP";
  voice.rate = 0.8;
  voice.pitch = 1.0;
  voice.volume = 1.0;

  window.speechSynthesis.speak(voice);
}

</script>

</body>
</html>
